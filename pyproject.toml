[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dashanan"
version = "0.3.0"
description = "Dashanan - multi-zone memory system for AI hosts. Memory Orchestrator core facade and unified context-assembly API (DASH-STORY-001)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# cryptography: added by DASH-STORY-020 (DSHN-69) -- the first third-party
# runtime dependency this project declares. DPDP-2 crypto-shredding (AES-256-GCM
# per-subject envelope encryption, Zone 8) requires a peer-reviewed AEAD cipher;
# application-security-core's OWASP A02 guidance explicitly forbids a hand-rolled
# cipher built on hashlib/hmac alone. See dashanan.domain.zone8_crypto_shredding's
# own module docstring and this story's dev report, judgment-call list.
#
# psycopg[binary]: added by DASH-STORY-024 (FR-015, AC-024-3) -- the first real
# PostgreSQL driver dependency this project declares (pyproject.toml previously
# declared zero, confirmed by backlog_draft.json's own 2026-09-20 exploration).
# Used by dashanan.infrastructure.migration_runner (applies every zone schema
# .sql file and binds the per-zone roles to real login credentials against a
# real Postgres instance) and by dashanan.infrastructure.composition_root's
# build_postgres_connection (the composition root's real, non-embedded Shape B
# adapter path). Pinned to the psycopg 3.x line, the actively maintained
# successor to psycopg2; [binary] avoids requiring a local libpq build toolchain
# in CI and on developer machines.
#
# fastapi/uvicorn/pyjwt: added by DASH-STORY-023 (FR-014, closing DSHN-60) --
# the first real network-facing host application this repository declares.
# fastapi hosts the 32 openapi.yaml operationIds; uvicorn is its ASGI server
# (dashanan.api.main); PyJWT verifies the mTLS-companion bearer JWT (HLD
# Section 2 Communication Matrix) rather than a hand-rolled HMAC decoder,
# per application-security-core's "use a peer-reviewed primitive" guidance
# already established for zone8_crypto_shredding's AES-256-GCM choice.
dependencies = [
    "cryptography>=42.0",
    "psycopg[binary]>=3.2,<4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
