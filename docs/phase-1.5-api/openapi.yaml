            w2: { type: number }
            w3: { type: number }
            w4: { type: number }
            w5: { type: number }
            w6: { type: number }
        lifecycle_state: { $ref: '#/components/schemas/LifecycleState' }
        predicted_crossings:
          type: object
          properties:
            promote_at: { type: string, format: date-time, nullable: true }
            compress_at: { type: string, format: date-time, nullable: true }
            archive_at: { type: string, format: date-time, nullable: true }

    ZoneSummary:
      type: object
      properties:
        zone: { $ref: '#/components/schemas/ZoneId' }
