        item_count: { type: integer }
        capacity_utilization: { type: number, minimum: 0, maximum: 1 }
        adapter_binding: { type: string }
        last_sweep_at: { type: string, format: date-time, nullable: true }

    ZoneDetail:
      allOf:
        - $ref: '#/components/schemas/ZoneSummary'
        - type: object
          properties:
            rotation_stats:
              type: object
              properties:
                promoted_24h: { type: integer }
                compressed_24h: { type: integer }
                archived_24h: { type: integer }
                evicted_24h: { type: integer }
                sweep_p99_ms: { type: number }

    ZoneConfig:
      type: object
      properties:
        zone: { $ref: '#/components/schemas/ZoneId' }
        lambda_zone: { type: number, nullable: true, description: Half-life decay constant; null for Zone 6 (Section 3.7 — no independent lambda_zone) }
        promote_threshold: { type: number, minimum: 0, maximum: 1 }
        compress_threshold: { type: number, minimum: 0, maximum: 1 }
        archive_threshold: { type: number, minimum: 0, maximum: 1 }
        capacity_cap: { type: integer, description: NEW requirement, OAQ-4 }
        max_age_seconds: { type: integer, nullable: true, description: NEW requirement, OAQ-4 forced archival backstop }
        idle_ttl_seconds: { type: integer, nullable: true, description: Zone 1 only, TTL-primary (OAQ-7) }
        adapter_binding: { type: string }

    ScoringConfig:
      type: object
      properties:
        w1: { type: number }
        w2: { type: number }
        w3: { type: number }
        w4: { type: number }
        w5: { type: number }
        w6: { type: number }
        promote_threshold: { type: number, minimum: 0, maximum: 1, default: 0.70, description: OAQ-2, lowered from 0.75 }
        compress_threshold: { type: number, minimum: 0, maximum: 1 }
        archive_threshold: { type: number, minimum: 0, maximum: 1, default: 0.25, description: OAQ-1 derived finding, raised from 0.15 }

    ZoneItemsPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryItem' }
