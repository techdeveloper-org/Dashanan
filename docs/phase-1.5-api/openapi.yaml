    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }

    JobStatus:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        progress: { type: number, minimum: 0, maximum: 1, nullable: true }
        error: { $ref: '#/components/schemas/ErrorResponse' }

    CreateTenantRequest:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string }
        embedding_residency:
          type: string
          enum: [in-region, global]
          default: in-region
          description: ADR-015; in-region is the DPDP-clean default for India-scoped tenants.

    UpdateTenantRequest:
      type: object
      properties:
        display_name: { type: string }
        embedding_residency: { type: string, enum: [in-region, global] }

    Tenant:
      type: object
      required: [tenant_id, display_name, created_at]
      properties:
        tenant_id: { type: string }
        display_name: { type: string }
        embedding_residency: { type: string, enum: [in-region, global] }
        created_at: { type: string, format: date-time }

    SubjectExportBundle:
      type: object
      properties:
        subject_id: { type: string }
        exported_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryItem' }
        provenance_chains:
          type: array
          items: { $ref: '#/components/schemas/ProvenanceChain' }

    ReadinessReport:
      type: object
      required: [ready, adapters]
      properties:
        ready: { type: boolean }
        adapters:
          type: object
          additionalProperties:
            type: string
            enum: [healthy, degraded, down]

  examples: {}

x-internal-event-contracts:
  # FR-013 (conflict_detected), FR-012 (promote/compress/archive/evicted),
  # FR-009 (written). Not HTTP operations — documented per Section 7.6 for
  # completeness of the async surface the task explicitly asked to cover.
  # Transport: Redis Streams, one stream per event type, partitioned by
  # tenant_id:item_id for per-item total ordering (ADR-003).
  envelope:
    event_id: { type: string, format: uuid, description: UUID v4 }
    event_type: { type: string }
    occurred_at: { type: string, format: date-time, description: ISO 8601 UTC }
    correlation_id: { type: string }
    causation_id: { type: string }
    tenant_id: { type: string }
    schema_version: { type: string, description: Additive-only evolution (EDA M6 FULL compatibility); field removal/retype requires a new event_type }
  events:
    memory.written:
      publisher: Orchestrator
      consumers: [index-worker, provenance-relay, rotation-worker]
      key: 'tenant:item'
      payload_fields: [item_id, zone, token_count, provenance_id, score_terms]
    memory.promoted:
      publisher: rotation-worker
      consumers: [index-worker, metrics]
      key: 'tenant:item'
      payload_fields: [item_id, from_zone, to_zone, trigger, score]
    memory.compressed:
      publisher: rotation-worker
      consumers: [index-worker, provenance-relay]
      key: 'tenant:item'
      payload_fields: [item_id, zone, generation, original_tokens, compressed_tokens]
    memory.archived:
      publisher: rotation-worker
      consumers: [index-worker, consolidation]
      key: 'tenant:item'
      payload_fields: [item_id, from_zone, blob_id]
    memory.evicted:
      publisher: rotation-worker
      consumers: [index-worker, metrics]
      key: 'tenant:item'
      payload_fields: [item_id, zone, reason]
    memory.conflict_detected:
      publisher: Orchestrator
      consumers: [provenance-relay, metrics, alerting]
      key: 'tenant:entity'
      payload_fields: [item_ids, predicate, both_confidences]

x-graphql-note: >-
  Not offered. HLD ADR-004 rejects GraphQL for this API: there is one
  dominant read shape (assemble a context), not a field-selection problem;
  GraphQL's N+1 resolution and query-cost-analysis costs would be paid for
  no benefit here. REST (this document) + gRPC (canonical, same operations)
  per ADR-004 stands as-is; no ADR-004 override was found in the HLD.
